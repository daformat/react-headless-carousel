<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>carousel loop playground</title>
    <style>
      body {
        font-family: system-ui;
        margin: 0;
        padding: 24px;
        background: #111;
        color: #eee;
      }
      .demo {
        margin-bottom: 40px;
      }
      .viewport {
        border: 1px solid #444;
      }
      .content {
        display: flex;
        gap: 12px;
        padding: 12px;
      }
      .item {
        width: 160px;
        height: 100px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #2b6cb0;
        color: white;
        font-size: 28px;
        user-select: none;
      }
      .item.dup {
        background: #2f855a;
      }
      pre {
        font-size: 12px;
        color: #9ae6b4;
      }
      button {
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
